# Main result: QIGA vs classical GA (and random search as a floor) at an equal evaluation budget.
# Knapsack: the three Pisinger correlation classes and three sizes; TSP: three sizes.
# All algorithms run without repair here; see repair.yaml for the repaired variants.
name: comparison
seeds: 30
max_evaluations: 30000

problems:
  - {type: knapsack, n: 100, correlation: strongly_correlated, seed: 0}
  - {type: knapsack, n: 250, correlation: strongly_correlated, seed: 0}
  - {type: knapsack, n: 500, correlation: strongly_correlated, seed: 0}
  - {type: knapsack, n: 250, correlation: uncorrelated, seed: 0}
  - {type: knapsack, n: 250, correlation: weakly_correlated, seed: 0}
  - {type: tsp, n: 30, seed: 0}
  - {type: tsp, n: 50, seed: 0}
  - {type: tsp, n: 100, seed: 0}

algorithms:
  - algorithm: qiga               # Han & Kim defaults: 10 Q-chromosomes, delta_theta = 0.01pi
  - algorithm: classical_ga
    params: {population_size: 50}
  - algorithm: random_search
    params: {population_size: 50}
