# https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html
[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
version = "0.1.0"
name = "qiga"
description = "Classical and Quantum-Inspired Genetic Algorithms for Combinatorial Optimization"
readme = "README.md"
requires-python = ">3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
#dynamic = ["version", "dependencies", "optional-dependencies"]
dynamic = ["dependencies", "optional-dependencies"]

#[project.urls]
#Repository = "github.com"
#Documentation = "github.com"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
#version = { attr = "qiga/__version__" }
dependencies = { file = ["requirements/main.txt"] }

[tool.setuptools.dynamic.optional-dependencies]
tests = { file = ["requirements/tests.txt"] }
linters = { file = ["requirements/linters.txt"] }

[tool.pylint.basic]
disable = ["missing-module-docstring", "missing-function-docstring", "missing-class-docstring", "pointless-string-statement"]
# Good variable names regexes, separated by a comma. If names match any regex,
# they will always be accepted
# (default: [])
good-names-rgxs = ["^[a-z]+$"]

# Regular expression which should only match function or class names that do not
# require a docstring.
# (default: "^_")
no-docstring-rgx = "^(_|Config)"

[tool.pylint.design]
# Maximum number of arguments for function / method.
max-args = 10

# Maximum number of attributes for a class (see R0902).
max-attributes = 10

# Minimum number of public methods for a class (see R0903)
# (default: 2)
min-public-methods = 0

[tool.pylint.format]
# Maximum number of characters on a single line.
max-line-length = 150

[tool.pylint.exceptions]
# Exceptions that will emit a warning when caught.
# (default: ["BaseException", "Exception"])
overgeneral-exceptions = ["builtins.BaseException"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov=src/{{ project_slug }} --cov-report html --cov-report term-missing --junit-xml report.xml"
testpaths = [
    "tests",
]
# when set to true all logs are printed
log_cli = false
log_level = "DEBUG"

[tool.black]
target-version = ["py314"]
line-length = 150
color = true
# Include only src and tests directories
include = 'src\/.*\.pyi?$|tests\/.*\.pyi?$'

[tool.isort]
profile = "black"
only_sections = true
force_single_line = true
force_sort_within_sections = true
line_length = 150
py_version = 314
skip_glob = ["docs/*"]
# Ignore all files listed in .gitignore.
skip_gitignore = true

[tool.autoflake]
ignore-init-module-imports = true
remove-all-unused-imports = true
expand-star-imports = true
remove-unused-variables = true
in-place = true
recursive = true
exclude = ".*venv, .git"

[tool.flake8]
# E203 is disabled as it has false positive for slices
ignore = ["E203", "E402", "H306", "SCS103", "SCS109", "W503", "W504"]
exclude = [
    '.git',
    '__pycache__',
    'docs',
    'old',
    'build',
    'dist',
    'tests/*',
]
max-line-length = 150
max-doc-length = 200
statistics = true
use_class_attributes_order_strict_mode = true
max-expression-complexity = 10
max-cognitive-complexity = 10

[tool.ruff]
line-length = 150
target-version = "py314"
src = ["src", "test"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "EXE001", "ANN", "PLR2004",]
flake8-quotes = { inline-quotes = "double", multiline-quotes = "double" }
mccabe = { max-complexity = 14 }
isort = { force-single-line = true, force-sort-within-sections = true }
pylint = { max-args = 10 }

[tool.ruff.lint.per-file-ignores]
"src/*/__main__.py" = ["B008", "T20"]
"tests/*" = ["PLW0129", "S101", "S105"]
